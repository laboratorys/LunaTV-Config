name: Build Rules JSON

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Process TS Files
        run: node build-rules.js

      - name: Commit and Push
        id: commit_step
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dist/rules.json dist/config.txt dist/config-demo.txt
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update rules.json and config.txt"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Purge jsDelivr Cache
        if: steps.commit_step.outputs.changed == 'true'
        run: |
          BASE_URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/dist"
          echo "正在刷新 rules.json..."
          curl -i "${BASE_URL}/rules.json"
          echo -e "\n正在刷新 config.txt..."
          curl -i "${BASE_URL}/config.txt"
          echo -e "\n正在刷新 config-demo.txt..."
          curl -i "${BASE_URL}/config-demo.txt"
      - name: Purge jsdmirror Cache
        if: steps.commit_step.outputs.changed == 'true'
        env:
          JSD_MIRROR_KEY: ${{ secrets.JSD_MIRROR_KEY }}
        run: |
          MIRROR_BASE="https://cdn.jsdmirror.com/gh/${{ github.repository }}@main/dist"
          for file in rules.json config.txt config-demo.txt; do
            echo "正在刷新 ${file}..."
            curl -X POST https://cache.jsdmirror.com/api/v1/purge \
              -H "Content-Type: application/json" \
              -H "X-API-Key: ${JSD_MIRROR_KEY}" \
              -d "{\"url\": \"${MIRROR_BASE}/${file}\"}"
            echo -e "\n"
          done

